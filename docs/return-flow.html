<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reglas de negocio · devolución · Biblioteca</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Biblioteca</p>
    <h1>Reglas de negocio — devolución de un libro</h1>

    <svg viewBox="0 0 760 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="return-flow-title return-flow-desc">
      <title id="return-flow-title">Reglas de negocio — devolución de un libro</title>
      <desc id="return-flow-desc">Flowchart del POST /return mostrando la validación del usuario, la búsqueda del préstamo activo, la transacción que registra la devolución y actualiza el estado del libro, y la respuesta de error 404.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (behind nodes) -->
      <line x1="300" y1="84" x2="300" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="184" x2="300" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="264" x2="300" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="356" x2="300" y2="388" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Error branches -->
      <line x1="380" y1="152" x2="560" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="232" x2="560" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="308" y="188" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SÍ</text>

      <rect x="308" y="272" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SÍ</text>

      <rect x="448" y="132" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="143" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO · 404</text>

      <rect x="448" y="212" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="223" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO · 404</text>

      <!-- Start oval -->
      <rect x="228" y="36" width="144" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="300" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">POST /return</text>

      <!-- Diamond 1: usuario existe -->
      <polygon points="300,120 380,152 300,184 220,152" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Usuario existe?</text>

      <!-- Diamond 2: préstamo activo -->
      <polygon points="300,200 380,232 300,264 220,232" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Préstamo activo</text>
      <text x="300" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">de este libro?</text>

      <!-- Step: transacción -->
      <rect x="204" y="292" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transacción</text>
      <text x="300" y="332" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">return_date · status update</text>

      <!-- End oval: 200 -->
      <rect x="228" y="388" width="144" height="48" rx="24" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="300" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">200 OK</text>

      <!-- Node: respuesta de error -->
      <rect x="560" y="128" width="128" height="160" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="128" width="128" height="160" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="568" y="132" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="582" y="143" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4XX</text>
      <text x="624" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Respuesta</text>
      <text x="624" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">de error</text>
      <text x="624" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">400 · 404</text>

      <!-- Legend -->
      <line x1="40" y1="492" x2="720" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="520" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="530" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Inicio / fin</text>

      <rect x="180" y="520" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="530" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Acción</text>

      <polygon points="324,528 336,520 348,528 336,536" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="356" y="528" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Decisión</text>

      <rect x="452" y="520" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="472" y="528" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Respuesta de error</text>

      <line x1="640" y1="524" x2="668" y2="524" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="676" y="528" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Resultado final</text>
    </svg>
  </div>
</body>
</html>
