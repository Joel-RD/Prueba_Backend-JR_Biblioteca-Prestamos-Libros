<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reglas de negocio · préstamo · Biblioteca</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Biblioteca</p>
    <h1>Reglas de negocio — préstamo de un libro</h1>

    <svg viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loan-flow-title loan-flow-desc">
      <title id="loan-flow-title">Reglas de negocio — préstamo de un libro</title>
      <desc id="loan-flow-desc">Flowchart del POST /borrow mostrando las validaciones de usuario y libro, disponibilidad, el límite de tres préstamos activos, la transacción y las respuestas de error 404, 409 y 403.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (behind nodes) -->
      <line x1="300" y1="84" x2="300" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="160" x2="300" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="248" x2="300" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="336" x2="300" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="424" x2="300" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="528" x2="300" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Error branches -->
      <line x1="380" y1="216" x2="560" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="304" x2="560" y2="304" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="380" y1="392" x2="560" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="308" y="252" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SÍ</text>

      <rect x="308" y="348" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="359" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SÍ</text>

      <rect x="308" y="436" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="322" y="447" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SÍ</text>

      <rect x="448" y="196" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="207" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO · 404</text>

      <rect x="448" y="284" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO · 409</text>

      <rect x="448" y="372" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="383" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO · 403</text>

      <!-- Start oval -->
      <rect x="228" y="36" width="144" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="300" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">POST /borrow</text>

      <!-- Step: validar body -->
      <rect x="224" y="112" width="152" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Validar body (Zod)</text>

      <!-- Diamond 1: usuario y libro existen -->
      <polygon points="300,184 380,216 300,248 220,216" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Usuario y libro</text>
      <text x="300" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">existen?</text>

      <!-- Diamond 2: libro disponible -->
      <polygon points="300,272 380,304 300,336 220,304" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="310" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Libro disponible?</text>

      <!-- Diamond 3: límite de 3 préstamos -->
      <polygon points="300,360 380,392 300,424 220,392" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Máx. 3 préstamos?</text>

      <!-- Step: transacción -->
      <rect x="204" y="464" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transacción</text>
      <text x="300" y="504" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INSERT loan · UPDATE book</text>

      <!-- End oval: 201 -->
      <rect x="228" y="552" width="144" height="48" rx="24" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="300" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">201 Created</text>

      <!-- Node: respuesta de error -->
      <rect x="560" y="200" width="128" height="320" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="200" width="128" height="320" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="568" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="582" y="215" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4XX</text>
      <text x="624" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Respuesta</text>
      <text x="624" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">de error</text>
      <text x="624" y="384" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">400 · 403 · 404 · 409</text>

      <!-- Legend -->
      <line x1="40" y1="656" x2="720" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

      <rect x="40" y="684" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="72" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Inicio / fin</text>

      <rect x="180" y="684" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="212" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Acción</text>

      <polygon points="324,692 336,684 348,692 336,700" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="356" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Decisión</text>

      <rect x="452" y="684" width="16" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="472" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Respuesta de error</text>

      <line x1="640" y1="688" x2="668" y2="688" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="676" y="692" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Resultado final</text>
    </svg>
  </div>
</body>
</html>
