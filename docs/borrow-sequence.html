<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POST /borrow · Secuencia · Biblioteca</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Biblioteca</p>
    <h1>POST /borrow — registro de préstamo</h1>

      <desc id="borrow-sequence-desc">Diagrama de secuencia del POST /borrow: el cliente llama a la API Express, que valida el body con Zod, consulta usuario y libro en PostgreSQL dentro de una transacción, e inserta el préstamo respondiendo 201 o un error 4xx.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

      <!-- alt frame -->

            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="156" y="396" width="40" height="16" rx="2"
            fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="176" y="408" fill="#4f5d75" font-size="8"
            font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="168" y="436" fill="#4f5d75" font-size="8"

      <line x1="720" y1="500" x2="464" y2="500" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <line x1="456" y1="624" x2="252" y2="624" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <rect x="556" y="260" width="68" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="528" y="300" width="124" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="568" y="480" width="44" height="12" rx="2" fill="#f5f5f5"/>

      <rect x="320" y="604" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="614" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ERROR · 4XX</text>

      <!-- Actor: Cliente -->

      <rect x="116" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>

      <text x="180" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Postman · curl</text>

      <!-- Actor: API Express -->
      <rect x="388" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="388" y="72" width="144" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="396" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="410" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="460" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Express</text>
      <text x="460" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">routes · controllers</text>

      <!-- Actor: PostgreSQL -->
      <rect x="648" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="648" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="656" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>

      <text x="720" y="118" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">node-postgres</text>

      <text x="56" y="688" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="56" y="704" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>

      <line x1="196" y1="708" x2="224" y2="708" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="232" y="712" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">HTTP request</text>

      <line x1="356" y1="708" x2="384" y2="708" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="392" y="712" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Llamada</text>

      <line x1="500" y1="708" x2="528" y2="708" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="536" y="712" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Retorno</text>

      <text x="680" y="712" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Éxito</text>

  </div>

</html>
