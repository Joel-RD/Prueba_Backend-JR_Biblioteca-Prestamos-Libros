<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de datos · Biblioteca</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · Biblioteca</p>
    <h1>Modelo de datos — books · users · loans</h1>

    <svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-model-title data-model-desc">
      <title id="data-model-title">Modelo de datos — books · users · loans</title>
      <desc id="data-model-desc">Diagrama entidad-relación que muestra la entidad central loans conectando a users y books con cardinalidad 1:N y los campos de cada tabla.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Relationship lines -->
      <line x1="304" y1="208" x2="372" y2="208" stroke="#4f5d75" stroke-width="1"/>
      <line x1="612" y1="208" x2="696" y2="208" stroke="#4f5d75" stroke-width="1"/>

      <!-- Cardinality labels -->
      <rect x="312" y="200" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="318" y="209" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <rect x="328" y="200" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="209" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

      <rect x="704" y="200" width="12" height="12" rx="2" fill="#f5f5f5"/>
      <text x="710" y="209" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <rect x="620" y="200" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="628" y="209" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

      <!-- Relationship labels -->
      <rect x="312" y="172" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="338" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">REGISTRA</text>

      <rect x="632" y="172" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="654" y="182" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TIENE</text>

      <!-- Entity: books -->
      <rect x="64" y="120" width="240" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="120" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
      <rect x="64" y="152" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="64" y1="160" x2="304" y2="160" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="80" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="80" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">books</text>
      <text x="80" y="180" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace"># id</text>
      <text x="288" y="180" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">serial</text>
      <text x="80" y="200" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">title</text>
      <text x="288" y="200" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">varchar · uq</text>
      <text x="80" y="220" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">author</text>
      <text x="288" y="220" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="80" y="240" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">publication_year</text>
      <text x="288" y="240" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">char[4]</text>
      <text x="80" y="260" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">stock</text>
      <text x="288" y="260" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="80" y="280" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">status</text>
      <text x="288" y="280" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>

      <!-- Entity: loans (focal) -->
      <rect x="372" y="128" width="240" height="160" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="372" y="128" width="240" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
      <rect x="372" y="160" width="240" height="8" fill="rgba(235,108,54,0.10)"/>
      <line x1="372" y1="168" x2="612" y2="168" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
      <text x="388" y="146" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · CENTRAL</text>
      <text x="388" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">loans</text>
      <text x="388" y="190" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace"># id</text>
      <text x="596" y="190" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">serial</text>
      <text x="388" y="210" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">→ user_id</text>
      <text x="596" y="210" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">fk→users</text>
      <text x="388" y="230" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">→ book_id</text>
      <text x="596" y="230" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">fk→books</text>
      <text x="388" y="250" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">borrow_date</text>
      <text x="596" y="250" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
      <text x="388" y="270" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">return_date</text>
      <text x="596" y="270" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">timestamp · null</text>

      <!-- Entity: users -->
      <rect x="696" y="128" width="240" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="696" y="128" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
      <rect x="696" y="160" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="696" y1="168" x2="936" y2="168" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="712" y="146" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="712" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">users</text>
      <text x="712" y="190" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace"># id</text>
      <text x="920" y="190" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">serial</text>
      <text x="712" y="210" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">name</text>
      <text x="920" y="210" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
      <text x="712" y="230" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">email</text>
      <text x="920" y="230" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">text · uq</text>
      <text x="712" y="250" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">password</text>
      <text x="920" y="250" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">text · hash</text>
      <text x="712" y="270" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace">created_at</text>
      <text x="920" y="270" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>

      <!-- Legend -->
      <line x1="40" y1="340" x2="960" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="372" width="16" height="12" rx="2" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="380" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Entidad central</text>

      <rect x="180" y="372" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="380" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Entidad</text>

      <text x="300" y="380" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">#</text>
      <text x="316" y="380" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Clave primaria</text>

      <text x="420" y="380" fill="#2d3142" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">→</text>
      <text x="436" y="380" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Clave foránea</text>

      <text x="540" y="380" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
      <text x="580" y="380" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Cardinalidad</text>
    </svg>
  </div>
</body>
</html>
